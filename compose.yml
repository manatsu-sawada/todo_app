services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rails
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rails"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
